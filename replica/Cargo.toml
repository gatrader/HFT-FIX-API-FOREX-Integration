[package]
name = "arbigab_replica"
version = "0.1.0"
edition = "2021"
description = "Clean-room replica of the Arbigab Polymarket quoter, built from static reverse-engineering of bot/bin/arbitrage_bot. See research/IMPLEMENTATION_SPEC.md."
publish = false

[dependencies]
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url         = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
rand        = "0.8"
clap        = { version = "4", features = ["derive", "env"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"

alloy-primitives     = "0.8"
alloy-sol-types      = "0.8"
alloy-signer         = "0.6"
alloy-signer-local   = "0.6"
alloy-dyn-abi        = { version = "0.8", features = ["eip712"] }

hmac                 = "0.12"
sha2                 = "0.10"
base64               = "0.22"
chrono               = "0.4"

# WS ingest — gated behind the `ws` feature so CI default stays
# lean and we only pull tungstenite when actually building with
# --features ws. Uses rustls to match the rest of the TLS stack
# (reqwest also uses rustls above).
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util      = { version = "0.3", optional = true }

[features]
default = []
# Enables src/ws.rs + the `ws-probe` subcommand.
# REST path remains the rollback default; --realtime in PR 3 will
# be the runtime switch between WS ingest and REST poll.
ws = ["dep:tokio-tungstenite", "dep:futures-util"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "arbigab-replica"
path = "src/main.rs"

[lib]
name = "arbigab_replica"
path = "src/lib.rs"
