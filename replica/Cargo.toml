[package]
name = "arbigab_replica"
version = "0.1.0"
edition = "2021"
description = "Clean-room replica of the Arbigab Polymarket quoter, built from static reverse-engineering of bot/bin/arbitrage_bot. See research/IMPLEMENTATION_SPEC.md."
publish = false

[dependencies]
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url         = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
rand        = "0.8"
clap        = { version = "4", features = ["derive", "env"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

alloy-primitives     = "0.8"
alloy-sol-types      = "0.8"
alloy-signer         = "0.6"
alloy-signer-local   = "0.6"
alloy-dyn-abi        = { version = "0.8", features = ["eip712"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "arbigab-replica"
path = "src/main.rs"

[lib]
name = "arbigab_replica"
path = "src/lib.rs"
